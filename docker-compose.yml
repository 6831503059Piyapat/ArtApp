
services:
  # 1. MySQL Database
  mysqldb:
    image: mysql:8.0
    container_name: mysql-container
    restart: always

    ports:
      - "3306:3306"

    env_file:
      - ./backend/.env

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app-network

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: springboot-backend
    restart: always

    ports:
      - "8081:8081"

    env_file:
      - ./backend/.env

    depends_on:
      mysqldb:
        condition: service_healthy

    networks:
      - app-network

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081

    container_name: nextjs-frontend
    restart: always

    ports:
      - "3000:3000"

    env_file:
      - ./frontend/.env

    environment:
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://backend:8081

    depends_on:
      - backend

    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
