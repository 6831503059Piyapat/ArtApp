spring.application.name=backend
# ตั้งค่า Database Connection
# เปลี่ยน 3306 เป็น port ที่ MySQL ของคุณรันอยู่ (เช่น 3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/artapp_db?useSSL=false&connectionTimeZone=Asia%2FBangkok&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ตั้งค่า JPA / Hibernate
# update = สร้าง/ปรับปรุงตารางอัตโนมัติตาม Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8081}
# รวมคำสั่ง insert เข้าด้วยกันเป็น Batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
